<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Michal Marcinkowski (51043) - AI LAB C</title>
    <link rel="stylesheet" href="leaflet-1.9.4/leaflet.css">
    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="leaflet-1.9.4/leaflet-src.js"></script>
    <script src="leaflet-1.9.4/leaflet-providers.js"></script>
    <script src="leaflet-1.9.4/leaflet-image.js"></script>
    <script src="scripts.js" defer></script>
</head>
<body>
    <main class="layout">
        <div class="box box-top">
            <div class="box-inner">
                <div id="map"></div>
            </div>
            <div class="btn-side btn-left">
                <button id="get-location" class="btn" type="button">Get Location</button>
                <button id="shuffle" class="btn" type="button">Shuffle</button>
            </div>
            <div class="btn-side btn-right">
                <button id="to-canvas" class="btn" type="button">To Canvas</button>
            </div>
        </div>
        <div class="box">
            <div id="raster-map" class="box-inner-grid"></div>
        </div>
        <div class="box">
            <div id="target" class="box-inner-grid"></div>
        </div>
    </main>
</body>
</html>
